name: Speiseplan täglich aktualisieren

on:
  schedule:
    # 06:00 UTC = 07:00 MEZ / 08:00 MESZ; GitHub schedules can be delayed.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: speiseplan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python-Abhängigkeiten
        run: python -m pip install -r requirements.txt
      - name: Parser- und Oberflächentests
        run: |
          npm ci --ignore-scripts
          python -m unittest discover -s tests -v
          npm test
      - name: Schulwebsite und PDF prüfen
        id: update
        run: python -m scripts.update
      - name: Daten bei Änderungen versionieren
        id: commit
        if: steps.update.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/menu.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: Speiseplan-Daten aktualisieren'
            git push
          fi
      - name: Warnungen als GitHub-Issue melden
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: python -m scripts.notify
